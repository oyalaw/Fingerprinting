experiment:
  experiment_id: exp1
  results_root: experiments/results
  # Operator-only storage metadata. It organizes files but never enters X.
  storage_locator: cnn/resnet/resnet18/image_classification/cifar10/pytorch/exp1
  output_dir: experiments/results/cnn/resnet/resnet18/image_classification/cifar10/pytorch/exp1/proxy
  existing_output_policy: error

proxy:
  listen_host: 10.42.0.1
  listen_port: 8080
  upstream_host: 10.42.0.195
  upstream_port: 8080
  connect_timeout_sec: 30
  buffer_size: 65536
  forwarding_log_enabled: false

capture:
  enabled: true
  # Interactive runs auto-detect this; scripted runs may set it explicitly.
  interface: wlo1
  # Default: discover participating clients from actual accepted proxy
  # connections. The BPF scopes traffic to 10.42.0.1:8080 and excludes
  # upstream 10.42.0.195, so client IPs are not required in advance.
  client_discovery_mode: automatic
  client_ips: []
  client_aliases: {}
  strict_client_isolation: true
  per_client_artifacts: true
  snaplen_bytes: 256
  offload_management:
    enabled: true
    required: true
    allow_sudo_noninteractive: true
    restore_on_exit: true
    features: [gro, gso, tso, lro]
  proxy_client_facing_ip: null
  extract_after: true
  burst_gap_sec: 0.05
  idle_threshold_sec: 0.5
  window_seconds: 5.0
  window_sizes_sec: [0.5, 1.0, 2.0, 5.0]
  allow_single_scale: false

architecture_inference:
  enabled: true
  realtime_enabled: true
  final_enabled: true
  realtime_required: true
  model_root: fingerprinting_models
  feature_modes: [full, size_normalized]
  confidence_threshold: 0.90
  stable_windows: 3
