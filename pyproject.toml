[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fingerprint-experiment"
version = "0.8.8"
description = "AI workload fingerprinting with corrected hierarchical model taxonomy, Fisher-selected hierarchical inference, multiscale proxy features, and federated experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "psutil>=5.9",
  "scikit-learn>=1.4"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
pytorch = [
  "torch",
  "torchvision",
  "transformers>=4.42"
]
tensorflow = ["tensorflow"]
datasets = ["datasets"]
dev = ["pytest"]
