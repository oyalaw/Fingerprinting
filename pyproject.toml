[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fingerprint-experiment"
version = "0.8.4"
description = "AI workload fingerprinting experiments with inference, centralized training, federated training, resource telemetry, and proxy traffic features"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "psutil>=5.9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
